# nginx.conf — reverse proxy for TSFA API
# NOTE: Not used in Phase 1 (Caddy is used instead).
# Kept here for Phase 2 deployment flexibility.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    upstream tsfa_api {
        server localhost:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.tsfa.io;

        # Redirect HTTP → HTTPS (handled by Caddy in production)
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.tsfa.io;

        # SSL certificates managed by Caddy / Certbot in production
        # ssl_certificate     /etc/ssl/certs/tsfa.crt;
        # ssl_certificate_key /etc/ssl/private/tsfa.key;

        # Apply rate limiting
        limit_req zone=api_limit burst=10 nodelay;

        location / {
            proxy_pass         http://tsfa_api;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection       "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /health {
            proxy_pass http://tsfa_api/health;
            access_log off;
        }
    }
}
